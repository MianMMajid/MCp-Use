name: Backend Service Mesh CI

on:
  push:
    branches:
      - main
      - backend
      - s1
      - s2
      - s3
      - s4
      - s5
      - s6
      - a6
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maple
          POSTGRES_PASSWORD: maple
          POSTGRES_DB: maple_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Branch Protection Gate (main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node backend/backendA-platform-infra/scripts/check-branch-protection.mjs --branch=main --required-checks=backend-checks,frontend-tests,k8s-release-gate

      - name: Preflight
        run: npm run preflight

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Test TLS Certificates
        run: bash backend/backendA-platform-infra/scripts/generate-local-certs.sh

      - name: Legacy Endpoint Guard
        run: npm run check:no-legacy-modifier-endpoints

      - name: Source-Backed Package Guard
        run: npm run check:source-backed-packages

      - name: Repo Hygiene Guard
        run: npm run check:repo-hygiene

      - name: Lockfile Policy Guard
        run: npm run check:lockfile-policy

      - name: Deprecated Command Alias Guard
        run: npm run check:deprecated-command-aliases

      - name: Tests
        env:
          FULL_MATRIX_STAGE_RETRIES: "1"
          SERVICE_AUDIT_POLICY: advisory
          SERVICE_UTILIZATION_RUNTIME_REQUIRED: "0"
          # ── Database ──
          DATABASE_URL: postgresql://maple:maple@127.0.0.1:5432/maple_test
          # ── Service ports ──
          GATEWAY_PORT: "8443"
          AUDIT_WRITER_PORT: "9400"
          AUDIT_WRITER_HTTP_PORT: "9401"
          CONTEXT_WALL_PORT: "9000"
          MCP_PROXY_PORT: "9200"
          TOOL_RUNNER_PORT: "9250"
          CYBER_PROXY_PORT: "8080"
          ADMIN_CONSOLE_PORT: "9443"
          BUSINESS_API_PORT: "9550"
          MAPLE_OPENCLAW_AGENT_GATEWAY_PORT: "19001"
          # ── Service hosts ──
          GATEWAY_HOST: "0.0.0.0"
          AUDIT_WRITER_HOST: "0.0.0.0"
          CONTEXT_WALL_HOST: "0.0.0.0"
          MCP_PROXY_HOST: "0.0.0.0"
          TOOL_RUNNER_HOST: "0.0.0.0"
          CYBER_PROXY_HOST: "0.0.0.0"
          ADMIN_CONSOLE_HOST: "0.0.0.0"
          BUSINESS_API_HOST: "0.0.0.0"
          # ── Service addresses ──
          CONTEXT_WALL_ADDRESS: "localhost:9000"
          MCP_PROXY_ADDRESS: "localhost:9200"
          TOOL_RUNNER_ADDRESS: "localhost:9250"
          CYBER_PROXY_ADDRESS: "localhost:8080"
          AUDIT_WRITER_ADDRESS: "localhost:9400"
          # ── TLS paths (generated by "Generate Test TLS Certificates" step) ──
          MAPLE_GRPC_TLS_CERT: "backend/backendA-platform-infra/certs/tls.crt"
          MAPLE_GRPC_TLS_KEY: "backend/backendA-platform-infra/certs/tls.key"
          MAPLE_GRPC_TLS_CA: "backend/backendA-platform-infra/certs/ca.crt"
          MAPLE_GATEWAY_TLS_CERT: "backend/backendA-platform-infra/certs/tls.crt"
          MAPLE_GATEWAY_TLS_KEY: "backend/backendA-platform-infra/certs/tls.key"
          MAPLE_GATEWAY_TLS_CA: "backend/backendA-platform-infra/certs/ca.crt"
          MAPLE_ADMIN_TLS_CERT: "backend/backendA-platform-infra/certs/tls.crt"
          MAPLE_ADMIN_TLS_KEY: "backend/backendA-platform-infra/certs/tls.key"
          MAPLE_ADMIN_TLS_CA: "backend/backendA-platform-infra/certs/ca.crt"
          MAPLE_BUSINESS_API_TLS_CERT: "backend/backendA-platform-infra/certs/tls.crt"
          MAPLE_BUSINESS_API_TLS_KEY: "backend/backendA-platform-infra/certs/tls.key"
          MAPLE_BUSINESS_API_TLS_CA: "backend/backendA-platform-infra/certs/ca.crt"
          MAPLE_BUSINESS_API_CA: "backend/backendA-platform-infra/certs/ca.crt"
          MAPLE_BUSINESS_API_CERT: "backend/backendA-platform-infra/certs/tls.crt"
          MAPLE_BUSINESS_API_KEY: "backend/backendA-platform-infra/certs/tls.key"
          # ── Auth & security ──
          MAPLE_ALLOW_NO_AUTH: "1"
          MAPLE_ADMIN_ALLOW_NO_AUTH: "0"
          MAPLE_ALLOW_BRIDGE_OVERRIDE: "0"
          MAPLE_LOCK_BRIDGE_TARGET: "0"
          MAPLE_AUTH_ALLOW_SELF_SIGNUP: "0"
          GOOGLE_CLIENT_ID: "ci-test-google-client-id"
          MAPLE_GPT_OAUTH_CLIENT_ID: "maple-gpt-client"
          MAPLE_GPT_OAUTH_CLIENT_SECRET: "maple-secret"
          MAPLE_SESSION_COOKIE_NAME: "maple_session"
          MAPLE_SESSION_TTL_SECONDS: "604800"
          MAPLE_SESSION_OWNER_SCOPE: "auto"
          MAPLE_TENANT_CLAIM_SIGNING_KEY: "ci-test-tenant-key"
          # ── Stripe billing ──
          STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_test"
          STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          STRIPE_PRICE_PRO: "price_pro_ci"
          STRIPE_PRICE_TEAM: "price_team_ci"
          STRIPE_PRICE_ENTERPRISE: "price_enterprise_ci"
          MCP_URL: "http://localhost:3000"
          CORS_ORIGIN: "*"
          # ── OpenClaw agent ──
          OPENCLAW_BRIDGE_URL: "http://127.0.0.1:8787"
          OPENCLAW_BRIDGE_TOKEN: "ci-test-bridge-token"
          MAPLE_OPENCLAW_AGENT_ENABLED: "1"
          MAPLE_OPENCLAW_AGENT_MODE: "gateway"
          MAPLE_OPENCLAW_AGENT_REQUIRED: "0"
          MAPLE_OPENCLAW_AGENT_DEV_PROFILE: "1"
          MAPLE_OPENCLAW_AGENT_AUTOSTART_GATEWAY: "0"
          MAPLE_OPENCLAW_AGENT_GATEWAY_BIND: "loopback"
          MAPLE_OPENCLAW_AGENT_DEFAULT_SESSION_ID: "agent-dev-main"
          MAPLE_OPENCLAW_AGENT_DEFAULT_THINKING: "medium"
          MAPLE_OPENCLAW_AGENT_TIMEOUT_SECONDS: "120"
          # ── OpenClaw modifier ──
          MAPLE_OPENCLAW_MODIFIER_ENABLED: "1"
          MAPLE_OPENCLAW_MODIFIER_ALLOW_DEV_PROFILE: "0"
          MAPLE_OPENCLAW_MODIFIER_APPROVAL_TTL_SECONDS: "900"
          MAPLE_OPENCLAW_MODIFIER_MAX_TIMEOUT_SECONDS: "90"
          MAPLE_OPENCLAW_MODIFIER_MAX_BUFFER_MB: "8"
          MAPLE_OPENCLAW_MODIFIER_SOURCE_PROFILE: "default"
          MAPLE_OPENCLAW_MODIFIER_ALLOWED_TOOLS: "agent,agents,message,sessions,status,health,gateway,memory,models,skills,nodes,logs"
          MAPLE_OPENCLAW_MODIFIER_DANGEROUS_TOOLS: "setup,onboard,configure,config,reset,uninstall,update,plugins,webhooks,hooks,pairing,devices,node,sandbox,daemon,voicecall,acp,system,directory,dns,browser,cron"
          MAPLE_OPENCLAW_MODIFIER_BLOCKED_TARGET_PROFILES: "default,main,primary,root,system"
          MAPLE_OPENCLAW_MODIFIER_REQUIRE_SCOPE: "1"
          MAPLE_OPENCLAW_MODIFIER_REQUIRE_ORG_RBAC: "1"
          MAPLE_OPENCLAW_MODIFIER_REQUIRE_TENANT_POLICY: "0"
          MAPLE_OPENCLAW_MODIFIER_AUTO_BOOTSTRAP_OWNER: "1"
          MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX: "1"
          MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX_INTERVAL_MS: "5000"
          MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX_BATCH_SIZE: "50"
          MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX_MAX_RETRIES: "5"
          # ── Enterprise ──
          MAPLE_STEP_UP_REQUIRED_FOR_APPROVALS: "0"
          MAPLE_ESCALATION_CHECK_INTERVAL_MS: "30000"
          MAPLE_RETENTION_CHECK_INTERVAL_MS: "86400000"
          MAPLE_MODIFIER_GOVERNANCE_ENABLED: "0"
          MAPLE_LEADER_ELECTION_ENABLED: "1"
          # ── OTLP / observability ──
          MAPLE_OTLP_ENDPOINT: "http://localhost:4318"
          MAPLE_OTLP_SERVICE_NAME: "gateway-api"
          MAPLE_OTLP_BATCH_SIZE: "100"
          MAPLE_OTLP_FLUSH_INTERVAL_MS: "5000"
          MAPLE_OTLP_TIMEOUT_MS: "5000"
          # ── Event transport ──
          MAPLE_EVENT_TRANSPORT_BACKEND: "pg"
          MAPLE_REDIS_URL: "redis://localhost:6379"
          # ── Fork isolation ──
          MAPLE_FORK_ISOLATION_MODE: "process"
          MAPLE_FORK_STEP_TIMEOUT_MS: "30000"
          MAPLE_FORK_TOTAL_TIMEOUT_MS: "120000"
          # ── Firewall chat ──
          MAPLE_FIREWALL_CHAT_PREFER_OPENCLAW: "1"
          MAPLE_FIREWALL_CHAT_STRICT_MODE: "0"
          MAPLE_FIREWALL_CHAT_PRIMARY: "openai"
          MAPLE_FIREWALL_CHAT_OPENAI_MODEL: "gpt-4o-mini"
          MAPLE_FIREWALL_CHAT_ANTHROPIC_MODEL: "claude-sonnet-4-6"
          MAPLE_FIREWALL_CHAT_TIMEOUT_MS: "15000"
          OPENAI_API_KEY: "ci-test-openai-key"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          # ── Session / MCP proxy ──
          MAPLE_SESSION_POLL: "1"
          MAPLE_SESSION_POLL_MS: "5000"
          MAPLE_MCP_FIREWALL_DEFAULT_APP: "default"
          MAPLE_MCP_PROXY_ALLOW_DYNAMIC_TARGETS: "0"
          MAPLE_MCP_PROXY_ALLOW_HTTP: "0"
          MAPLE_MCP_PROXY_ALLOW_PRIVATE_TARGETS: "0"
          MAPLE_MCP_PROXY_DEFAULT_TARGET_URL: "http://localhost:3000"
          MAPLE_MCP_PROXY_ALLOWED_HOSTS: "localhost"
          MAPLE_MCP_EXECUTION_ORDER: "default"
          MAPLE_DOWNSTREAM_TOOLS_CACHE_TTL_MS: "15000"
          MAPLE_MCP_ROUTE_LOCK: "0"
          MAPLE_ENABLE_DEMO_ROUTES: "1"
          MAPLE_ENABLE_JUDGE_UI: "1"
          # ── Context wall ──
          CONTEXT_WALL_HITL_TIMEOUT_MS: "120000"
          # ── MCP proxy config ──
          DOWNSTREAM_APPS: "none"
          MAPLE_DOWNSTREAM_APPS: "none"
          MAPLE_TOOL_RUNNER_MODE: "service"
          MAPLE_TOOL_RUNNER_IMAGE: "tool-runner:latest"
          MAPLE_TOOL_RUNNER_JOB_NAMESPACE: "maple-tools"
          # ── Cyber proxy ──
          CYBER_ALLOWED_DOMAINS: "example.com"
          CYBER_BLOCKED_DOMAINS: "evil.com"
          CYBER_TOOL_ALLOWED_DOMAINS_JSON: "{}"
          CYBER_MAX_RESPONSE_BYTES: "10485760"
          CYBER_QUARANTINE_ENABLED: "1"
          # ── Business API ──
          MAPLE_BUSINESS_API_BASE_URL: "http://localhost:9550"
          MAPLE_BUSINESS_API_REQUIRED: "0"
          MAPLE_BUSINESS_API_TIMEOUT_MS: "3000"
          MAPLE_BUSINESS_API_MTLS_REQUIRED: "1"
          MAPLE_BUSINESS_API_SKIP_DB_INIT: "0"
          MAPLE_MODEL_ROUTER_RETIRED: "1"
          MAPLE_SECRETS_BROKER_RETIRED: "1"
          MAPLE_DISABLE_AUDIT_EMIT: "1"
          # ── Recovery ──
          MAPLE_RECOVERY_DELIVERY_REQUIRED: "0"
          MAPLE_RECOVERY_EMAIL_PROVIDER: "none"
          MAPLE_RECOVERY_EMAIL_FROM: "noreply@ci.test"
          MAPLE_RECOVERY_EMAIL_REPLY_TO: "support@ci.test"
          MAPLE_RECOVERY_EMAIL_SUBJECT_PREFIX: "[Maple]"
          MAPLE_RECOVERY_RESET_BASE_URL: "http://localhost:3000/reset"
          MAPLE_RECOVERY_VERIFY_BASE_URL: "http://localhost:3000/verify"
          SENDGRID_API_KEY: "ci-test-sendgrid-key"
          RESEND_API_KEY: "ci-test-resend-key"
          MAPLE_RECOVERY_SMS_PROVIDER: "none"
          MAPLE_RECOVERY_SMS_TO: "+1234567890"
          MAPLE_RECOVERY_SMS_FROM: "+0987654321"
          TWILIO_ACCOUNT_SID: "ci-test-twilio-sid"
          TWILIO_AUTH_TOKEN: "ci-test-twilio-token"
        run: bash scripts/run-full-matrix.sh --backend

      - name: Upload Matrix Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-matrix-artifacts
          path: artifacts/matrix
          if-no-files-found: ignore

      - name: Contract Sync Gate
        run: |
          npm run contracts:generate
          git diff --exit-code -- backend/proto backend/backendB-core-services/proto backend/backendB-core-services/contracts/proto backend/backendB-core-services/admin-console-api/proto

      - name: Build Mesh Services
        run: npm run mesh:build

      - name: Dist Sync Gate
        run: |
          git diff --exit-code -- backend/backendB-core-services/*/service/dist backend/backendC-saas-services/*/service/dist

  build-and-push:
    needs: backend-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/backendA-platform-infra/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
