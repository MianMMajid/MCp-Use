name: Backend Service Mesh CI

on:
  push:
    branches:
      - main
      - s1
      - s2
      - s3
      - s4
      - s5
      - a6
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build Mesh Services
        run: npm run mesh:build
