name: frontend-tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - "tests/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - "tests/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Legacy Endpoint Guard
        run: npm run check:no-legacy-modifier-endpoints

      - name: Source-Backed Package Guard
        run: npm run check:source-backed-packages

      - name: Repo Hygiene Guard
        run: npm run check:repo-hygiene

      - name: Lockfile Policy Guard
        run: npm run check:lockfile-policy

      - name: Deprecated Command Alias Guard
        run: npm run check:deprecated-command-aliases

      - name: Frontend test flow
        env:
          COVERAGE_POLICY: advisory
          FULL_MATRIX_STAGE_RETRIES: "1"
          SERVICE_AUDIT_POLICY: advisory
          SERVICE_UTILIZATION_RUNTIME_REQUIRED: "0"
        run: bash scripts/run-full-matrix.sh --frontend

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-matrix-artifacts
          path: artifacts/matrix
          if-no-files-found: ignore

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: tests/frontend/coverage
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-artifacts
          path: tests/frontend/artifacts/playwright
          if-no-files-found: ignore
