appId: com.maple.desktop
productName: Maple Desktop
asar: true
directories:
  output: installers/dist
  buildResources: electron/assets
files:
  - "**/*"
  - "!installers/dist/**"
  - "!node_modules/**"
  - "!scripts/**"
  - "!template-runtime/**"
artifactName: maple-desktop-${version}-${os}-${arch}.${ext}
mac:
  icon: icon.icns
  identity: null # Set to Developer ID certificate for production: "Developer ID Application: Your Name (TEAMID)"
  gatekeeperAssess: false # Set to true when code signing is configured
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: icon.png
  target:
    - AppImage
