appId: com.maple.desktop
productName: Maple Desktop
asar: true
directories:
  output: installers/dist
files:
  - "**/*"
  - "!installers/dist/**"
  - "!node_modules/**"
  - "!scripts/**"
artifactName: maple-desktop-${version}-${os}-${arch}.${ext}
mac:
  identity: null
  gatekeeperAssess: false
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
