syntax = "proto3";

package maple.secrets.v1;

import "maple/common/v1/common.proto";

// ── Service ──────────────────────────────────────────────────────────────────

service SecretsBrokerService {
  // Mint a short-lived, scoped credential for tool execution
  rpc MintCredential(MintCredentialRequest) returns (MintCredentialResponse);

  // Revoke a previously minted credential
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);

  // Check status of a credential
  rpc GetCredentialStatus(GetCredentialStatusRequest) returns (GetCredentialStatusResponse);

  // List all active (non-expired, non-revoked) credentials
  rpc ListActiveCredentials(ListActiveCredentialsRequest) returns (ListActiveCredentialsResponse);
}

// ── Enums ────────────────────────────────────────────────────────────────────

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_EXPIRED = 2;
  CREDENTIAL_STATUS_REVOKED = 3;
}

// ── Messages ─────────────────────────────────────────────────────────────────

message Credential {
  string credential_id = 1;
  string tool_name = 2;
  string app_id = 3;
  repeated string scopes = 4;
  string issued_at = 5;
  string expires_at = 6;
  CredentialStatus status = 7;
  string issued_by = 8;
}

message MintCredentialRequest {
  maple.common.v1.RequestContext context = 1;
  string tool_name = 2;
  string app_id = 3;
  repeated string scopes = 4;
  int32 ttl_seconds = 5;
}

message MintCredentialResponse {
  Credential credential = 1;
  string token = 2;
}

message RevokeCredentialRequest {
  string credential_id = 1;
  string reason = 2;
}

message RevokeCredentialResponse {
  bool revoked = 1;
  string credential_id = 2;
}

message GetCredentialStatusRequest {
  string credential_id = 1;
}

message GetCredentialStatusResponse {
  Credential credential = 1;
}

message ListActiveCredentialsRequest {
  string app_id = 1;
  string tool_name = 2;
}

message ListActiveCredentialsResponse {
  repeated Credential credentials = 1;
}
