syntax = "proto3";

package maple.context.v1;

import "maple/common/v1/common.proto";

// ── Service ──────────────────────────────────────────────────────────────────

service ContextWallService {
  // Evaluate a single trace step against the policy engine
  rpc EvaluateStep(EvaluateStepRequest) returns (EvaluateStepResponse);

  // Evaluate an entire trace (batch)
  rpc EvaluateTrace(EvaluateTraceRequest) returns (EvaluateTraceResponse);

  // Read-only policy decision lookup
  rpc GetPolicyDecision(GetPolicyDecisionRequest) returns (GetPolicyDecisionResponse);

  // Submit HITL approval/rejection
  rpc SubmitApproval(SubmitApprovalRequest) returns (SubmitApprovalResponse);

  // Watch the HITL approval queue (server-streaming)
  rpc WatchApprovalQueue(WatchApprovalQueueRequest) returns (stream WatchApprovalQueueResponse);

  // List pending HITL approvals (snapshot)
  rpc ListPendingApprovals(ListPendingApprovalsRequest) returns (ListPendingApprovalsResponse);

  // Full risk audit on a trace
  rpc AuditTrace(AuditTraceRequest) returns (AuditTraceResponse);

  // Sanitize a prompt by redacting secrets and dangerous patterns
  rpc SanitizePrompt(SanitizePromptRequest) returns (SanitizePromptResponse);

  // Check which tools from a list are allowed by firewall policy
  rpc GetAllowedTools(GetAllowedToolsRequest) returns (GetAllowedToolsResponse);

  // Orchestrate a chat request: sanitize/evaluate prompt and invoke model-router
  rpc OrchestrateChat(OrchestrateChatRequest) returns (OrchestrateChatResponse);

  // Evaluate a tool call and execute it via mcp-proxy when allowed
  rpc ExecuteToolWithPolicy(ExecuteToolWithPolicyRequest) returns (ExecuteToolWithPolicyResponse);

  // Evaluate and forward a raw JSON-RPC payload via mcp-proxy
  rpc ForwardJsonRpcWithPolicy(ForwardJsonRpcWithPolicyRequest) returns (ForwardJsonRpcWithPolicyResponse);

  // Hot-reload external policy rules from disk
  rpc ReloadPolicies(ReloadPoliciesRequest) returns (ReloadPoliciesResponse);
}

// ── Request/Response ─────────────────────────────────────────────────────────

message EvaluateStepRequest {
  maple.common.v1.TraceStep step = 1;
  maple.common.v1.RequestContext context = 2;
}

message EvaluateStepResponse {
  maple.common.v1.PolicyDecision decision = 1;
  maple.common.v1.TraceStep processed_step = 2;
}

message EvaluateTraceRequest {
  maple.common.v1.Trace trace = 1;
  maple.common.v1.RequestContext context = 2;
}

message EvaluateTraceResponse {
  maple.common.v1.EnforcementSummary summary = 1;
  maple.common.v1.Trace processed_trace = 2;
}

message GetPolicyDecisionRequest {
  string trace_id = 1;
  int32 step_index = 2;
  string action = 3;
  string tool_name = 4;
  string tenant_id = 5;
  string user_id = 6;
  string device_id = 7;
  maple.common.v1.RequestContext context = 8;
}

message GetPolicyDecisionResponse {
  maple.common.v1.PolicyDecision decision = 1;
}

message SubmitApprovalRequest {
  string trace_id = 1;
  int32 step_index = 2;
  maple.common.v1.GuardAction action = 3;
  string reason = 4;
  string approver_id = 5;
}

message SubmitApprovalResponse {
  bool accepted = 1;
  string trace_id = 2;
  int32 step_index = 3;
  maple.common.v1.GuardAction resulting_action = 4;
}

message WatchApprovalQueueRequest {
  string session_id = 1;
}

message WatchApprovalQueueResponse {
  string trace_id = 1;
  int32 step_index = 2;
  maple.common.v1.TraceStep step = 3;
  maple.common.v1.PolicyDecision pending_decision = 4;
  string requested_at = 5;
}

message ListPendingApprovalsRequest {
  string session_id = 1;
}

message ListPendingApprovalsResponse {
  repeated WatchApprovalQueueResponse approvals = 1;
}

message AuditTraceRequest {
  maple.common.v1.Trace trace = 1;
  int32 top_flags = 2;
  repeated double community_baselines = 3;
  double embedding_threshold = 4;
}

message AuditTraceResponse {
  maple.common.v1.AuditReport report = 1;
  maple.common.v1.Trace audited_trace = 2;
}

message SanitizePromptRequest {
  string prompt = 1;
  maple.common.v1.RequestContext context = 2;
}

message SanitizePromptResponse {
  string sanitized_prompt = 1;
  repeated string redacted_patterns = 2;
  bool had_secrets = 3;
  bool blocked = 4;
  string blocked_reason = 5;
  repeated string injection_patterns = 6;
}

message GetAllowedToolsRequest {
  repeated string tool_names = 1;
  maple.common.v1.RequestContext context = 2;
}

message GetAllowedToolsResponse {
  repeated string allowed_tools = 1;
  repeated string denied_tools = 2;
}

message ChatTurn {
  string role = 1;
  string content = 2;
}

message OrchestrateChatRequest {
  maple.common.v1.RequestContext context = 1;
  repeated ChatTurn messages = 2;
  string system_prompt = 3;
  string model = 4;
  double temperature = 5;
  int32 max_tokens = 6;
  repeated maple.common.v1.ToolInfo tools = 7;
}

message OrchestrateChatResponse {
  bool allowed = 1;
  string blocked_reason = 2;
  string reply = 3;
  string model = 4;
  repeated string redacted_patterns = 5;
}

message ToolExecutionScope {
  repeated string allowed_domains = 1;
  int64 max_bytes = 2;
  bool allow_file_download = 3;
}

message ExecuteToolWithPolicyRequest {
  maple.common.v1.RequestContext context = 1;
  string app_id = 2;
  string target_url = 3;
  string tool_name = 4;
  bytes arguments_json = 5;
  string session_id = 6;
  string trace_id = 7;
  ToolExecutionScope scope = 8;
}

message ExecuteToolWithPolicyResponse {
  bool allowed = 1;
  string blocked_reason = 2;
  maple.common.v1.PolicyDecision decision = 3;
  bool success = 4;
  bytes result_json = 5;
  string error_message = 6;
  int64 duration_ms = 7;
  string app_id = 8;
  string tool_name = 9;
}

message ForwardJsonRpcWithPolicyRequest {
  maple.common.v1.RequestContext context = 1;
  string app_id = 2;
  string target_url = 3;
  bytes payload_json = 4;
}

message ForwardJsonRpcWithPolicyResponse {
  bool allowed = 1;
  string blocked_reason = 2;
  maple.common.v1.PolicyDecision decision = 3;
  bool success = 4;
  bytes response_json = 5;
  string error_message = 6;
}

message ReloadPoliciesRequest {}

message ReloadPoliciesResponse {
  bool success = 1;
  int32 rule_count = 2;
  string error_message = 3;
}
