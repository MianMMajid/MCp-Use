syntax = "proto3";

package maple.audit.v1;

import "maple/common/v1/common.proto";

// ── Audit Event Types ────────────────────────────────────────────────────────

enum AuditEventType {
  AUDIT_EVENT_TYPE_UNSPECIFIED = 0;

  // Policy events
  AUDIT_EVENT_TYPE_POLICY_EVALUATED = 1;
  AUDIT_EVENT_TYPE_POLICY_DENIED = 2;
  AUDIT_EVENT_TYPE_POLICY_ALLOWED = 3;
  AUDIT_EVENT_TYPE_POLICY_LOG_ONLY = 4;
  AUDIT_EVENT_TYPE_SECRET_REDACTED = 5;

  // HITL events
  AUDIT_EVENT_TYPE_HITL_REQUESTED = 6;
  AUDIT_EVENT_TYPE_HITL_APPROVED = 7;
  AUDIT_EVENT_TYPE_HITL_REJECTED = 8;
  AUDIT_EVENT_TYPE_HITL_TIMEOUT = 9;

  // Tool events
  AUDIT_EVENT_TYPE_TOOL_DISPATCHED = 10;
  AUDIT_EVENT_TYPE_TOOL_COMPLETED = 11;
  AUDIT_EVENT_TYPE_TOOL_FAILED = 12;
  AUDIT_EVENT_TYPE_TOOL_CHAIN_STARTED = 13;
  AUDIT_EVENT_TYPE_TOOL_CHAIN_COMPLETED = 14;

  // Secret events
  AUDIT_EVENT_TYPE_CREDENTIAL_MINTED = 15;
  AUDIT_EVENT_TYPE_CREDENTIAL_REVOKED = 16;
  AUDIT_EVENT_TYPE_CREDENTIAL_EXPIRED = 17;

  // Network events
  AUDIT_EVENT_TYPE_URL_CHECKED = 18;
  AUDIT_EVENT_TYPE_URL_BLOCKED = 19;
  AUDIT_EVENT_TYPE_CONTENT_SCANNED = 20;
  AUDIT_EVENT_TYPE_PROXY_REQUEST = 21;

  // Model events
  AUDIT_EVENT_TYPE_MODEL_GENERATE = 22;
  AUDIT_EVENT_TYPE_MODEL_STREAM = 23;

  // Trace events
  AUDIT_EVENT_TYPE_TRACE_CREATED = 24;
  AUDIT_EVENT_TYPE_TRACE_UPDATED = 25;
  AUDIT_EVENT_TYPE_TRACE_FORKED = 26;
  AUDIT_EVENT_TYPE_TRACE_QUARANTINED = 27;

  // System events
  AUDIT_EVENT_TYPE_SERVICE_STARTED = 28;
}

// ── Messages ─────────────────────────────────────────────────────────────────

message AuditEvent {
  string event_id = 1;
  AuditEventType event_type = 2;
  string timestamp = 3;
  string source_service = 4;
  maple.common.v1.RequestContext context = 5;
  bytes payload_json = 6;
  maple.common.v1.RiskSeverity severity = 7;
  string summary = 8;
}

// ── Service ──────────────────────────────────────────────────────────────────

service AuditWriterService {
  // Append a single audit event
  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse);

  // Append multiple audit events in a batch
  rpc AppendEventBatch(AppendEventBatchRequest) returns (AppendEventBatchResponse);

  // Bidirectional streaming for high-throughput event ingestion
  rpc StreamEvents(stream StreamEventsRequest) returns (stream StreamEventsResponse);

  // Query audit events with filters
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsResponse);

  // Stream query results for large result sets
  rpc QueryEventsStream(QueryEventsStreamRequest) returns (stream QueryEventsStreamResponse);
}

// ── Request/Response ─────────────────────────────────────────────────────────

message AppendEventRequest {
  AuditEvent event = 1;
}

message AppendEventResponse {
  string event_id = 1;
  string persisted_at = 2;
}

message AppendEventBatchRequest {
  repeated AuditEvent events = 1;
}

message AppendEventBatchResponse {
  int32 persisted_count = 1;
  repeated string event_ids = 2;
  string persisted_at = 3;
}

message StreamEventsRequest {
  AuditEvent event = 1;
}

message StreamEventsResponse {
  string event_id = 1;
  bool accepted = 2;
}

message QueryEventsRequest {
  // Filters
  string trace_id = 1;
  string session_id = 2;
  string source_service = 3;
  repeated AuditEventType event_types = 4;
  string since = 5;
  string until = 6;
  maple.common.v1.RiskSeverity min_severity = 7;

  // Pagination
  int32 limit = 8;
  string cursor = 9;
}

message QueryEventsResponse {
  repeated AuditEvent events = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message QueryEventsStreamRequest {
  // Filters
  string trace_id = 1;
  string session_id = 2;
  string source_service = 3;
  repeated AuditEventType event_types = 4;
  string since = 5;
  string until = 6;
  maple.common.v1.RiskSeverity min_severity = 7;

  // Pagination
  int32 limit = 8;
  string cursor = 9;
}

message QueryEventsStreamResponse {
  AuditEvent event = 1;
}
