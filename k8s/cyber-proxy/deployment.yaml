apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyber-proxy
  namespace: maple-cyber
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-proxy
  namespace: maple-cyber
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cyber-proxy
  template:
    metadata:
      labels:
        app: cyber-proxy
    spec:
      serviceAccountName: cyber-proxy
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: cyber-proxy
          image: cyber-proxy:latest
          ports:
            - containerPort: 8080
            - containerPort: 8888
          env:
            - name: CYBER_PROXY_PORT
              value: "8080"
            - name: AUDIT_WRITER_ADDRESS
              value: audit-writer.maple-observability:9400
            - name: MAPLE_GRPC_TLS_CERT
              value: /etc/maple/grpc-tls/tls.crt
            - name: MAPLE_GRPC_TLS_KEY
              value: /etc/maple/grpc-tls/tls.key
            - name: MAPLE_GRPC_TLS_CA
              value: /etc/maple/grpc-tls/ca.crt
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://otel-collector.maple-observability:4318
            - name: OTEL_SERVICE_NAME
              value: cyber-proxy
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/maple/grpc-tls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: grpc-tls
          secret:
            secretName: maple-grpc-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-proxy
  namespace: maple-cyber
spec:
  selector:
    app: cyber-proxy
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
    - name: http-connect
      port: 8888
      targetPort: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cyber-proxy-policy
  namespace: maple-cyber
spec:
  podSelector:
    matchLabels:
      app: cyber-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: tool-runner
      ports:
        - port: 8080
        - port: 8888
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - port: 9400
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
        - port: 4318
    - ports:
        - port: 443
        - port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
