apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-router
  namespace: maple-model
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-router
  namespace: maple-model
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-router
  template:
    metadata:
      labels:
        app: model-router
    spec:
      serviceAccountName: model-router
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: model-router
          image: model-router:latest
          ports:
            - containerPort: 9100
          env:
            - name: MODEL_ROUTER_PORT
              value: "9100"
            - name: AUDIT_WRITER_ADDRESS
              value: audit-writer.maple-observability:9400
            - name: MAPLE_GRPC_TLS_CERT
              value: /etc/maple/grpc-tls/tls.crt
            - name: MAPLE_GRPC_TLS_KEY
              value: /etc/maple/grpc-tls/tls.key
            - name: MAPLE_GRPC_TLS_CA
              value: /etc/maple/grpc-tls/ca.crt
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://otel-collector.maple-observability:4318
            - name: OTEL_SERVICE_NAME
              value: model-router
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/maple/grpc-tls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: grpc-tls
          secret:
            secretName: maple-grpc-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: model-router
  namespace: maple-model
spec:
  selector:
    app: model-router
  ports:
    - port: 9100
      targetPort: 9100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-router-policy
  namespace: maple-model
spec:
  podSelector:
    matchLabels:
      app: model-router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: context-wall
      ports:
        - port: 9100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - port: 9400
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
        - port: 4318
    - ports:
        - port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
