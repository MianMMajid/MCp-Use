# ── cert-manager Issuers for Maple Firewall ──────────────────────────────────
#
# Bootstrap chain:
# 1. Self-signed ClusterIssuer → issues the internal CA certificate
# 2. Internal CA Certificate   → acts as root for all maple-internal certs
# 3. CA-backed ClusterIssuer   → issues service certificates signed by the CA
#
# Prerequisites: cert-manager must be installed in the cluster.
# Install: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: maple-selfsigned-issuer
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maple-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: maple-internal-ca
  secretName: maple-internal-ca-secret
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: maple-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: maple-internal-ca-issuer
spec:
  ca:
    secretName: maple-internal-ca-secret
