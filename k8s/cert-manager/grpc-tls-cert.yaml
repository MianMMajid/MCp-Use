# ── gRPC TLS Certificates (per-namespace) ─────────────────────────────────────
#
# One Certificate per namespace for inter-service gRPC mTLS.
# Each uses secretName "maple-grpc-tls" matching the volume mounts
# in service deployments (see deployment.yaml files).
#
# All certificates are issued by the maple-internal-ca-issuer.

---
# maple-gateway namespace (gateway-api)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maple-grpc-tls
  namespace: maple-gateway
spec:
  secretName: maple-grpc-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - client auth
  dnsNames:
    - gateway-api
    - gateway-api.maple-gateway.svc
    - gateway-api.maple-gateway.svc.cluster.local
  issuerRef:
    name: maple-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

