apiVersion: v1
kind: ServiceAccount
metadata:
  name: context-wall
  namespace: maple-context
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-wall
  namespace: maple-context
spec:
  replicas: 2
  selector:
    matchLabels:
      app: context-wall
  template:
    metadata:
      labels:
        app: context-wall
    spec:
      serviceAccountName: context-wall
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: context-wall
          image: context-wall:latest
          ports:
            - containerPort: 9000
          env:
            - name: CONTEXT_WALL_PORT
              value: "9000"
            - name: AUDIT_WRITER_ADDRESS
              value: audit-writer.maple-observability.svc:9400
            - name: MODEL_ROUTER_ADDRESS
              value: model-router.maple-model.svc:9100
            - name: MCP_PROXY_ADDRESS
              value: mcp-proxy.maple-tools.svc:9200
            - name: CONTEXT_WALL_HITL_TIMEOUT_MS
              value: "120000"
            - name: MAPLE_GRPC_TLS_CERT
              value: /etc/maple/grpc-tls/tls.crt
            - name: MAPLE_GRPC_TLS_KEY
              value: /etc/maple/grpc-tls/tls.key
            - name: MAPLE_GRPC_TLS_CA
              value: /etc/maple/grpc-tls/ca.crt
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://otel-collector.maple-observability:4318
            - name: OTEL_SERVICE_NAME
              value: context-wall
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/maple/grpc-tls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: grpc-tls
          secret:
            secretName: maple-grpc-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: context-wall
  namespace: maple-context
spec:
  selector:
    app: context-wall
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-wall-policy
  namespace: maple-context
spec:
  podSelector:
    matchLabels:
      app: context-wall
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: gateway-api
      ports:
        - port: 9000
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: admin-console
      ports:
        - port: 9000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: model-router
      ports:
        - port: 9100
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: mcp-proxy
      ports:
        - port: 9200
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - port: 9400
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
        - port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
