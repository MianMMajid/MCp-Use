apiVersion: v1
kind: Secret
metadata:
  name: maple-edge-tls
  namespace: maple-gateway
type: Opaque
stringData:
  # Replace with real PEM values before applying.
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SERVER_CERT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_SERVER_KEY
    -----END PRIVATE KEY-----
  client-ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CA
    -----END CERTIFICATE-----
