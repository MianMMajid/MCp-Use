# Default-deny NetworkPolicies for all Maple namespaces.
# Service-specific policies allowlist the required traffic.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: maple-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: maple-context
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
