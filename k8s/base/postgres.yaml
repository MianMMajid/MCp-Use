apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: maple-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: maple
            - name: POSTGRES_PASSWORD
              value: maple
            - name: POSTGRES_DB
              value: maple
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: maple-observability
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: maple-observability
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: gateway-api
      ports:
        - port: 5432
