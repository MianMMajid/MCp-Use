# ── gRPC TLS Secret Template ──────────────────────────────────────────────────
#
# This is a placeholder template for manual certificate provisioning.
# When using cert-manager (recommended), certificates are automatically
# provisioned and this file is not needed.
#
# For manual provisioning:
# 1. Generate certificates using your CA
# 2. Replace the base64 placeholders below
# 3. Apply one Secret per namespace
#
# Usage:
#   kubectl apply -f grpc-tls-secret.yaml -n <namespace>
#
# The secretName "maple-grpc-tls" matches the volume mounts in all
# service deployment.yaml files.

apiVersion: v1
kind: Secret
metadata:
  name: maple-grpc-tls
  # Apply to each namespace: maple-gateway, maple-context, maple-model,
  # maple-tools, maple-cyber, maple-observability, maple-admin
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-certificate>
  tls.key: <base64-encoded-private-key>
  ca.crt: <base64-encoded-ca-certificate>
