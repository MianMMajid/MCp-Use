apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-broker
  namespace: maple-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-broker
  namespace: maple-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-broker
  template:
    metadata:
      labels:
        app: secrets-broker
    spec:
      serviceAccountName: secrets-broker
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: secrets-broker
          image: secrets-broker:latest
          ports:
            - containerPort: 9300
          env:
            - name: SECRETS_BROKER_PORT
              value: "9300"
            - name: AUDIT_WRITER_ADDRESS
              value: audit-writer.maple-observability:9400
            - name: MAPLE_GRPC_TLS_CERT
              value: /etc/maple/grpc-tls/tls.crt
            - name: MAPLE_GRPC_TLS_KEY
              value: /etc/maple/grpc-tls/tls.key
            - name: MAPLE_GRPC_TLS_CA
              value: /etc/maple/grpc-tls/ca.crt
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://otel-collector.maple-observability:4318
            - name: OTEL_SERVICE_NAME
              value: secrets-broker
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/maple/grpc-tls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: grpc-tls
          secret:
            secretName: maple-grpc-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: secrets-broker
  namespace: maple-tools
spec:
  selector:
    app: secrets-broker
  ports:
    - port: 9300
      targetPort: 9300
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secrets-broker-policy
  namespace: maple-tools
spec:
  podSelector:
    matchLabels:
      app: secrets-broker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcp-proxy
      ports:
        - port: 9300
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
      ports:
        - port: 9400
        - port: 4317
        - port: 4318
