apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-proxy
  namespace: maple-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-proxy
  namespace: maple-tools
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-proxy
  template:
    metadata:
      labels:
        app: mcp-proxy
    spec:
      serviceAccountName: mcp-proxy
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: mcp-proxy
          image: mcp-proxy:latest
          ports:
            - containerPort: 9200
          env:
            - name: MCP_PROXY_PORT
              value: "9200"
            - name: CONTEXT_WALL_ADDRESS
              value: context-wall.maple-context.svc:9000
            - name: SECRETS_BROKER_ADDRESS
              value: secrets-broker.maple-tools.svc:9300
            - name: TOOL_RUNNER_ADDRESS
              value: tool-runner.maple-tools.svc:9250
            - name: CYBER_PROXY_ADDRESS
              value: cyber-proxy.maple-cyber.svc:8080
            - name: AUDIT_WRITER_ADDRESS
              value: audit-writer.maple-observability.svc:9400
            - name: MAPLE_DOWNSTREAM_APPS
              value: ""
            - name: MAPLE_TOOL_RUNNER_MODE
              value: "service"
            - name: MAPLE_GRPC_TLS_CERT
              value: /etc/maple/grpc-tls/tls.crt
            - name: MAPLE_GRPC_TLS_KEY
              value: /etc/maple/grpc-tls/tls.key
            - name: MAPLE_GRPC_TLS_CA
              value: /etc/maple/grpc-tls/ca.crt
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://otel-collector.maple-observability:4318
            - name: OTEL_SERVICE_NAME
              value: mcp-proxy
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/maple/grpc-tls
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: grpc-tls
          secret:
            secretName: maple-grpc-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-proxy
  namespace: maple-tools
spec:
  selector:
    app: mcp-proxy
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-proxy-policy
  namespace: maple-tools
spec:
  podSelector:
    matchLabels:
      app: mcp-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: context-wall
      ports:
        - port: 9200
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: secrets-broker
      ports:
        - port: 9300
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: tool-runner
      ports:
        - port: 9250
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - port: 9400
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: maple
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
        - port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
