syntax = "proto3";

package maple.tools.v1;

import "../../common/v1/common.proto";

message CyberReport {
  string url_reputation = 1;
  bool sanitized = 2;
  bool malware = 3;
  bool quarantined = 4;
  repeated string threats_found = 5;
  string quarantine_reason = 6;
  string resolved_ip = 7;
}

message ExecuteJsonRpcRequest {
  maple.common.v1.RequestContext context = 1;
  string app_id = 2;
  string target_url = 3;
  bytes payload_json = 4;
  int32 timeout_ms = 5;
  string credential_id = 6;
  string credential_token = 7;
  repeated string credential_scopes = 8;
}

message ExecuteJsonRpcResponse {
  bool success = 1;
  bytes response_json = 2;
  string error_message = 3;
  int64 duration_ms = 4;
  int32 status_code = 5;
  maple.tools.v1.CyberReport cyber_report = 6;
}

service ToolRunnerService {
  rpc ExecuteJsonRpc (ExecuteJsonRpcRequest) returns (ExecuteJsonRpcResponse);
}
