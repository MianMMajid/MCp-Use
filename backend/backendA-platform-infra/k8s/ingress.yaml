# Ingress resources for Maple MCP Firewall
# Hosts use substitution vars — set via Kustomize overlays per environment.
# TLS is managed by cert-manager when available.
# Required ingress controller: nginx (ingress-nginx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maple-gateway
  namespace: maple
  labels:
    app: gateway-api
    app.kubernetes.io/part-of: maple-stack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - $(MAPLE_GATEWAY_HOST)
      secretName: $(MAPLE_GATEWAY_TLS_SECRET)
  rules:
    - host: $(MAPLE_GATEWAY_HOST)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maple-console
  namespace: maple
  labels:
    app: frontend-a-it-console
    app.kubernetes.io/part-of: maple-stack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - $(MAPLE_CONSOLE_HOST)
      secretName: $(MAPLE_CONSOLE_TLS_SECRET)
  rules:
    - host: $(MAPLE_CONSOLE_HOST)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-a-it-console
                port:
                  number: 8080
