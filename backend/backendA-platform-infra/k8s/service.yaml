apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: maple
spec:
  type: ClusterIP
  selector:
    app: gateway-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-bridge
  namespace: maple
spec:
  type: ClusterIP
  selector:
    app: gateway-api
  ports:
    - name: http
      port: 8787
      targetPort: 8787
---
apiVersion: v1
kind: Service
