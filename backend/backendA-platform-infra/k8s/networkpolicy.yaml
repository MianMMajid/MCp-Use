apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-default-deny
  namespace: maple
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway-api
          - context-wall
          - model-router
          - mcp-proxy
          - cyber-proxy
          - tool-runner
          - secrets-broker
          - audit-writer
          - admin-console-api
          - business-api
          - postgres
          - openclaw-gateway
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-dns-egress
  namespace: maple
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway-api
          - context-wall
          - model-router
          - mcp-proxy
          - cyber-proxy
          - tool-runner
          - secrets-broker
          - audit-writer
          - admin-console-api
          - business-api
          - openclaw-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-api-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: gateway-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8787
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: context-wall
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: secrets-broker
      ports:
        - protocol: TCP
          port: 9300
    - to:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 9400
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: business-api
      ports:
        - protocol: TCP
          port: 9550
    - to:
        - podSelector:
            matchLabels:
              app: openclaw-gateway
      ports:
        - protocol: TCP
          port: 19001
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
