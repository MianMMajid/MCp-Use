---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-writer-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: audit-writer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - gateway-api
                  - context-wall
                  - mcp-proxy
                  - cyber-proxy
      ports:
        - protocol: TCP
          port: 9400
        - protocol: TCP
          port: 9401
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 9400
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-api
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-gateway-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: openclaw-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-api
      ports:
        - protocol: TCP
          port: 19001
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
