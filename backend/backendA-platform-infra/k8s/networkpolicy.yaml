        - podSelector:
            matchLabels:
              app: model-router
      ports:
        - protocol: TCP
          port: 9100
    - to:
        - podSelector:
            matchLabels:
              app: mcp-proxy
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 9400
---
