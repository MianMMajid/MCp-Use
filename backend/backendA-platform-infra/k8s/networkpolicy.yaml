apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-default-deny
  namespace: maple
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway-api
          - context-wall
          - mcp-proxy
          - cyber-proxy
          - audit-writer
          - postgres
          - openclaw-gateway
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-dns-egress
  namespace: maple
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway-api
          - context-wall
          - mcp-proxy
          - cyber-proxy
          - audit-writer
          - openclaw-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-api-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: gateway-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8787
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: context-wall
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 9400
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: openclaw-gateway
      ports:
        - protocol: TCP
          port: 19001
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-wall-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: context-wall
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-api
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mcp-proxy
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 9400
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-proxy-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: mcp-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: context-wall
      ports:
        - protocol: TCP
          port: 9200
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: cyber-proxy
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 9400
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cyber-proxy-network
  namespace: maple
spec:
  podSelector:
    matchLabels:
      app: cyber-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcp-proxy
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: audit-writer
      ports:
        - protocol: TCP
          port: 9400
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
