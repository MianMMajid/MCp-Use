apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-api
  namespace: maple
  labels:
    app: gateway-api
    app.kubernetes.io/part-of: maple-stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: context-wall
  namespace: maple
  labels:
    app: context-wall
    app.kubernetes.io/part-of: maple-stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: context-wall
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-proxy
  namespace: maple
  labels:
    app: mcp-proxy
    app.kubernetes.io/part-of: maple-stack
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: mcp-proxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cyber-proxy
  namespace: maple
  labels:
    app: cyber-proxy
    app.kubernetes.io/part-of: maple-stack
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cyber-proxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
