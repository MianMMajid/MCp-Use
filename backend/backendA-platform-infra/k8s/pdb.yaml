apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-api
  namespace: maple
  labels:
    app: gateway-api
    app.kubernetes.io/part-of: maple-stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-api
