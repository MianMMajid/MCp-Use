# Maple Secrets — LOCAL DEVELOPMENT ONLY
#
# PRODUCTION: Do NOT commit real secrets to this file.
# Instead, inject production values via one of:
#   1. External Secrets Operator (externalsecrets.io)
#   2. Sealed Secrets (bitnami-labs/sealed-secrets)
#   3. CI/CD pipeline secret injection (e.g. GitHub Actions secrets)
#   4. Vault (hashicorp/vault) with CSI driver
#
# The placeholders below allow `kubectl apply` for local dev.
# Override with `kubectl create secret generic maple-secrets --from-literal=...`
apiVersion: v1
kind: Secret
metadata:
  name: maple-secrets
  namespace: maple
  labels:
    app.kubernetes.io/part-of: maple-stack
  annotations:
    description: "Local development defaults — replace in production"
type: Opaque
stringData:
  # API authentication key — MUST be rotated for production
  MAPLE_API_KEY: "local-demo-key"
  # Admin console password — MUST be set to a strong password
  MAPLE_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  # OpenClaw bridge/gateway tokens — MUST be unique per environment
  OPENCLAW_BRIDGE_TOKEN: "CHANGE_ME_IN_PRODUCTION"
  OPENCLAW_GATEWAY_TOKEN: "CHANGE_ME_IN_PRODUCTION"
  # Billing and auth placeholders (local only)
  STRIPE_SECRET_KEY: "sk_test_local_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_local_placeholder"
  STRIPE_PRICE_PRO: "price_local_pro"
  STRIPE_PRICE_TEAM: "price_local_team"
  STRIPE_PRICE_ENTERPRISE: "price_local_enterprise"
  STRIPE_PUBLISHABLE_KEY: "pk_test_local_placeholder"
  GOOGLE_CLIENT_ID: "local-google-client-id"
  MAPLE_GPT_OAUTH_CLIENT_ID: "local-gpt-client-id"
  MAPLE_GPT_OAUTH_CLIENT_SECRET: "local-gpt-client-secret"
  MAPLE_TENANT_CLAIM_SIGNING_KEY: "local-tenant-claim-signing-key"
  OPENAI_API_KEY: "sk-local-openai-placeholder"
  ANTHROPIC_API_KEY: "sk-ant-local-placeholder"
  RESEND_API_KEY: "re_local_placeholder"
  SENDGRID_API_KEY: "sg_local_placeholder"
  TWILIO_ACCOUNT_SID: "AC00000000000000000000000000000000"
  TWILIO_AUTH_TOKEN: "local-twilio-auth-token"
  # PostgreSQL credentials — MUST use strong passwords in production
  POSTGRES_USER: "maple"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "maple"
