apiVersion: v1
kind: ConfigMap
metadata:
  name: maple-config
  namespace: maple
data:
  NODE_ENV: "development"
  HOST: "0.0.0.0"
  PORT: "3000"
  GATEWAY_PORT: "3000"
  GATEWAY_HOST: "0.0.0.0"
  CORS_ORIGIN: "*"
  MCP_URL: "https://localhost:3000"
  MAPLE_LOG_LEVEL: "info"
  MAPLE_LOG_INCLUDE_BODIES: "false"
  MAPLE_LOG_REQUESTS: "true"
  MAPLE_LOG_BODY_MAX_CHARS: "2000"
  MAPLE_FIREWALL_LOG_DIR: "/tmp/maple-firewall-logs"
  MAPLE_ALLOW_NO_AUTH: "false"
  MAPLE_ALLOW_BRIDGE_OVERRIDE: "true"
  MAPLE_ENABLE_JUDGE_UI: "true"
  MAPLE_ENABLE_DEMO_ROUTES: "false"
  MAPLE_LOCK_BRIDGE_TARGET: "false"
  MAPLE_MCP_ROUTE_LOCK: "true"
  MAPLE_MCP_FIREWALL_DEFAULT_APP: "toolhub"
  MAPLE_MCP_EXECUTION_ORDER: "toolhub"
  MAPLE_MCP_PROXY_ALLOW_DYNAMIC_TARGETS: "true"
  MAPLE_MCP_PROXY_ALLOW_HTTP: "true"
  MAPLE_MCP_PROXY_ALLOW_PRIVATE_TARGETS: "true"
  MAPLE_MCP_PROXY_DEFAULT_TARGET_URL: "http://mcp-proxy.maple.svc.cluster.local:9200"
  MAPLE_MCP_PROXY_ALLOWED_HOSTS: "localhost,mcp-proxy.maple.svc.cluster.local"
  MAPLE_DOWNSTREAM_TOOLS_CACHE_TTL_MS: "15000"
  MAPLE_SESSION_OWNER_SCOPE: "auto"
  MAPLE_SESSION_COOKIE_NAME: "maple_session"
  MAPLE_SESSION_TTL_SECONDS: "604800"
  MAPLE_AUTH_ALLOW_SELF_SIGNUP: "true"
  MAPLE_TOOLHUB_PORT: "8788"
  HACKATHON_TOOLHUB_HOST: "127.0.0.1"
  MAPLE_ADMIN_ALLOW_NO_AUTH: "true"
  AUDIT_WRITER_PORT: "9400"
  AUDIT_WRITER_HTTP_PORT: "9401"
  AUDIT_WRITER_HOST: "0.0.0.0"
  CONTEXT_WALL_PORT: "9000"
  CONTEXT_WALL_HOST: "0.0.0.0"
  CONTEXT_WALL_HITL_TIMEOUT_MS: "30000"
  MCP_PROXY_PORT: "9200"
  MCP_PROXY_HOST: "0.0.0.0"
  CYBER_PROXY_PORT: "8080"
  CYBER_PROXY_HOST: "0.0.0.0"
  CYBER_ALLOWED_DOMAINS: "example.com,localhost"
  CYBER_BLOCKED_DOMAINS: "169.254.169.254,metadata.google.internal"
  CYBER_TOOL_ALLOWED_DOMAINS_JSON: "{}"
  CYBER_MAX_RESPONSE_BYTES: "10485760"
  CYBER_QUARANTINE_ENABLED: "1"
  MCP_PROXY_ADDRESS: "dns:///mcp-proxy.maple.svc.cluster.local:9200"
  CYBER_PROXY_ADDRESS: "dns:///cyber-proxy.maple.svc.cluster.local:8080"
  DOWNSTREAM_APPS: '[{"id":"toolhub","name":"ToolHub","mcpUrl":"http://mcp-proxy.maple.svc.cluster.local:9200/mcp","enabled":true,"apiKey":"local-demo-key","authHeader":"x-api-key","authScheme":"raw","timeoutMs":12000}]'
  MAPLE_DOWNSTREAM_APPS: '[{"id":"toolhub","name":"ToolHub","mcpUrl":"http://mcp-proxy.maple.svc.cluster.local:9200/mcp","enabled":true,"apiKey":"local-demo-key","authHeader":"x-api-key","authScheme":"raw","timeoutMs":12000}]'
  MAPLE_TOOL_RUNNER_MODE: "in-process"
  MAPLE_ADMIN_USERNAME: "admin"
  MAPLE_ADMIN_EMAIL: "admin@localhost"
  MAPLE_SESSION_POLL: "0"
  MAPLE_SESSION_POLL_MS: "5000"
  DEFAULT_MODEL: "gpt-4o-mini"
  OPENCLAW_BRIDGE_URL: "http://127.0.0.1:8787"
  OPENCLAW_BRIDGE_MODE: "local"
  OPENCLAW_BRIDGE_PORT: "8787"
  OPENCLAW_GATEWAY_WS_URL: "ws://openclaw-gateway.maple.svc.cluster.local:19001"
  OPENCLAW_GATEWAY_CONTROL_UI_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,https://localhost,https://127.0.0.1"
  OPENCLAW_GATEWAY_SESSION_KEY: "agent-dev-main"
  MAPLE_OPENCLAW_AGENT_ENABLED: "true"
  MAPLE_OPENCLAW_AGENT_MODE: "gateway"
  MAPLE_OPENCLAW_AGENT_REQUIRED: "false"
  MAPLE_OPENCLAW_AGENT_DEV_PROFILE: "true"
  MAPLE_OPENCLAW_AGENT_AUTOSTART_GATEWAY: "false"
  MAPLE_OPENCLAW_AGENT_GATEWAY_PORT: "19001"
  MAPLE_OPENCLAW_AGENT_GATEWAY_BIND: "loopback"
  MAPLE_OPENCLAW_AGENT_DEFAULT_SESSION_ID: "agent-dev-main"
  MAPLE_OPENCLAW_AGENT_DEFAULT_THINKING: "medium"
  MAPLE_OPENCLAW_AGENT_TIMEOUT_SECONDS: "120"
  MAPLE_OPENCLAW_MODIFIER_ENABLED: "true"
  MAPLE_OPENCLAW_MODIFIER_SOURCE_PROFILE: "default"
  MAPLE_OPENCLAW_MODIFIER_ALLOW_DEV_PROFILE: "false"
  MAPLE_OPENCLAW_MODIFIER_ALLOWED_TOOLS: "all"
  MAPLE_OPENCLAW_MODIFIER_DANGEROUS_TOOLS: "none"
  MAPLE_OPENCLAW_MODIFIER_BLOCKED_TARGET_PROFILES: "none"
  MAPLE_OPENCLAW_MODIFIER_APPROVAL_TTL_SECONDS: "900"
  MAPLE_OPENCLAW_MODIFIER_MAX_TIMEOUT_SECONDS: "90"
  MAPLE_OPENCLAW_MODIFIER_MAX_BUFFER_MB: "8"
  MAPLE_OPENCLAW_MODIFIER_REQUIRE_SCOPE: "true"
  MAPLE_OPENCLAW_MODIFIER_REQUIRE_ORG_RBAC: "true"
  MAPLE_OPENCLAW_MODIFIER_REQUIRE_TENANT_POLICY: "false"
  MAPLE_OPENCLAW_MODIFIER_AUTO_BOOTSTRAP_OWNER: "true"
  MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX: "true"
  MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX_INTERVAL_MS: "5000"
  MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX_BATCH_SIZE: "50"
  MAPLE_OPENCLAW_MODIFIER_AUDIT_OUTBOX_MAX_RETRIES: "5"
  MAPLE_STEP_UP_REQUIRED_FOR_APPROVALS: "false"
  MAPLE_ESCALATION_CHECK_INTERVAL_MS: "30000"
  MAPLE_RETENTION_CHECK_INTERVAL_MS: "86400000"
  MAPLE_MODIFIER_GOVERNANCE_ENABLED: "false"
  MAPLE_LEADER_ELECTION_ENABLED: "true"
  MAPLE_OTLP_ENDPOINT: "http://localhost:4318"
  MAPLE_OTLP_SERVICE_NAME: "gateway-api"
  MAPLE_OTLP_BATCH_SIZE: "100"
  MAPLE_OTLP_FLUSH_INTERVAL_MS: "5000"
  MAPLE_OTLP_TIMEOUT_MS: "10000"
  MAPLE_EVENT_TRANSPORT_BACKEND: "pg"
  MAPLE_REDIS_URL: "redis://localhost:6379"
  MAPLE_FIREWALL_CHAT_PREFER_OPENCLAW: "false"
  MAPLE_FIREWALL_CHAT_STRICT_MODE: "false"
  MAPLE_FIREWALL_CHAT_PRIMARY: "openai"
  MAPLE_FIREWALL_CHAT_OPENAI_MODEL: "gpt-4o-mini"
  MAPLE_FIREWALL_CHAT_ANTHROPIC_MODEL: "claude-sonnet-4-6"
  MAPLE_FIREWALL_CHAT_TIMEOUT_MS: "15000"
  MAPLE_RECOVERY_DELIVERY_REQUIRED: "false"
  MAPLE_RECOVERY_EMAIL_PROVIDER: "none"
  MAPLE_RECOVERY_EMAIL_FROM: "no-reply@localhost"
  MAPLE_RECOVERY_EMAIL_REPLY_TO: "support@localhost"
  MAPLE_RECOVERY_EMAIL_SUBJECT_PREFIX: "[Maple]"
  MAPLE_RECOVERY_RESET_BASE_URL: "http://localhost:3300/reset-password"
  MAPLE_RECOVERY_VERIFY_BASE_URL: "http://localhost:3300/verify-email"
  MAPLE_RECOVERY_SMS_PROVIDER: "none"
  MAPLE_RECOVERY_SMS_TO: "+10000000000"
  MAPLE_RECOVERY_SMS_FROM: "+10000000001"
  MAPLE_DISABLE_AUDIT_EMIT: "1"
  MAPLE_FORK_ISOLATION_MODE: ""
  MAPLE_FORK_STEP_TIMEOUT_MS: "30000"
  MAPLE_FORK_TOTAL_TIMEOUT_MS: "120000"
  MAPLE_FORK_EXECUTOR_IMAGE: ""
  MAPLE_FORK_EXECUTOR_JOB_NAMESPACE: "maple"
