apiVersion: v1
kind: ConfigMap
metadata:
  name: maple-config
  namespace: maple
data:
  NODE_ENV: "development"
  HOST: "0.0.0.0"
  PORT: "3000"
  MCP_URL: "https://localhost:3000"
  MAPLE_ALLOW_NO_AUTH: "false"
  MAPLE_ENABLE_JUDGE_UI: "true"
  MAPLE_ENABLE_DEMO_ROUTES: "true"
  MAPLE_LOCK_BRIDGE_TARGET: "false"
  MAPLE_MCP_ROUTE_LOCK: "true"
  MAPLE_MCP_FIREWALL_DEFAULT_APP: "toolhub"
  MAPLE_MCP_EXECUTION_ORDER: "toolhub"
  MAPLE_TOOLHUB_PORT: "8788"
  HACKATHON_TOOLHUB_HOST: "127.0.0.1"
  MAPLE_BUSINESS_API_BASE_URL: "https://business-api.maple.svc.cluster.local:9550"
  MAPLE_BUSINESS_API_REQUIRED: "true"
  MAPLE_BUSINESS_API_TIMEOUT_MS: "3000"
  MAPLE_ADMIN_USERNAME: "admin"
  MAPLE_ADMIN_EMAIL: "admin@localhost"
  MAPLE_SESSION_POLL: "0"
  OPENCLAW_BRIDGE_URL: "http://127.0.0.1:8787"
  OPENCLAW_BRIDGE_MODE: "local"
  OPENCLAW_BRIDGE_PORT: "8787"
  OPENCLAW_GATEWAY_WS_URL: "ws://openclaw-gateway.maple.svc.cluster.local:19001"
  OPENCLAW_GATEWAY_SESSION_KEY: "agent:dev:main"
