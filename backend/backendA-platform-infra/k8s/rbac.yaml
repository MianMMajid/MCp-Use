    app.kubernetes.io/part-of: maple-stack
---
# ── Role: job-dispatcher ─────────────────────────────────────────
# Used by mcp-proxy and gateway-api for K8s job dispatch
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-dispatcher
  namespace: maple
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
# ── RoleBindings ─────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-proxy-job-dispatcher
  namespace: maple
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-dispatcher
subjects:
  - kind: ServiceAccount
    name: mcp-proxy-sa
    namespace: maple
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-api-job-dispatcher
  namespace: maple
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-dispatcher
subjects:
  - kind: ServiceAccount
    name: gateway-api-sa
    namespace: maple
