    app.kubernetes.io/part-of: maple-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: business-api-sa
  namespace: maple
  labels:
    app: business-api
    app.kubernetes.io/part-of: maple-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: context-wall-sa
  namespace: maple
  labels:
    app: context-wall
    app.kubernetes.io/part-of: maple-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-writer-sa
  namespace: maple
  labels:
    app: audit-writer
    app.kubernetes.io/part-of: maple-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tool-runner-sa
  namespace: maple
  labels:
    app: tool-runner
    app.kubernetes.io/part-of: maple-stack
---
apiVersion: v1
