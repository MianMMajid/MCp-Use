apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: maple
  labels:
    app: postgres
    app.kubernetes.io/part-of: maple-stack
    maple-image: managed
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: maple-stack
        maple-image: managed
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: maple-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: maple
  labels:
    app: gateway-api
    app.kubernetes.io/part-of: maple-stack
    maple-image: managed
spec:
  # replicas managed by HPA
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
        app.kubernetes.io/part-of: maple-stack
        maple-image: managed
    spec:
      serviceAccountName: gateway-api-sa
      containers:
        - name: app
          image: maple-local:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/backend/backendB-core-services/gateway-api/service
          command: ["node", "/app/backend/backendB-core-services/gateway-api/service/src/main.js"]
          ports:
            - name: https
              containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: GATEWAY_PORT
              value: "3000"
            - name: MAPLE_STATE_DIR
              value: /app/backend/backendB-core-services/gateway-api/service/.mcp-use
            - name: MAPLE_GATEWAY_TLS_CERT
              value: /etc/maple/tls/tls.crt
            - name: MAPLE_GATEWAY_TLS_KEY
              value: /etc/maple/tls/tls.key
            - name: MAPLE_GATEWAY_TLS_CA
              value: /etc/maple/tls/ca.crt
            - name: MAPLE_BUSINESS_API_CA
              value: /etc/maple/tls/ca.crt
            - name: MAPLE_BUSINESS_API_CERT
              value: /etc/maple/tls/tls.crt
            - name: MAPLE_BUSINESS_API_KEY
              value: /etc/maple/tls/tls.key
            - name: MAPLE_GRPC_TLS_CERT
              value: /etc/maple/tls/tls.crt
            - name: MAPLE_GRPC_TLS_KEY
              value: /etc/maple/tls/tls.key
            - name: MAPLE_GRPC_TLS_CA
              value: /etc/maple/tls/ca.crt
            - name: CONTEXT_WALL_ADDRESS
              value: context-wall.maple.svc.cluster.local:9000
            - name: SECRETS_BROKER_ADDRESS
              value: secrets-broker.maple.svc.cluster.local:9300
            - name: AUDIT_WRITER_ADDRESS
              value: audit-writer.maple.svc.cluster.local:9400
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.maple.svc.cluster.local:5432/$(POSTGRES_DB)
            - name: OPENCLAW_BRIDGE_URL
              value: http://127.0.0.1:8787
            - name: OPENCLAW_GATEWAY_WS_URL
              value: ws://openclaw-gateway.maple.svc.cluster.local:19001
            - name: OPENCLAW_BRIDGE_MODE
              value: local
          envFrom:
            - configMapRef:
                name: maple-config
            - secretRef:
                name: maple-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: maple-tls
              mountPath: /etc/maple/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: openclaw-bridge
          image: maple-local:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/backendA-platform-infra/scripts/openclaw-bridge-hardcoded.mjs"]
          env:
            - name: OPENCLAW_BRIDGE_PORT
              value: "8787"
            - name: OPENCLAW_BRIDGE_MODE
              value: local
            - name: OPENCLAW_GATEWAY_WS_URL
              value: ws://openclaw-gateway.maple.svc.cluster.local:19001
            - name: OPENCLAW_GATEWAY_SESSION_KEY
              value: agent-dev-main
          envFrom:
            - secretRef:
                name: maple-secrets
          ports:
            - name: openclaw-bridge
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /health
              port: openclaw-bridge
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: maple-tls
          secret:
            secretName: maple-tls
        - name: tmp
          emptyDir: {}
---
