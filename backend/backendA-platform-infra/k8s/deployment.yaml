apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: maple
  labels:
    app: postgres
    app.kubernetes.io/part-of: maple-stack
    maple-image: managed
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: maple-stack
        maple-image: managed
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: maple-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: maple
  labels:
    app: gateway-api
    app.kubernetes.io/part-of: maple-stack
    maple-image: managed
spec:
  # replicas managed by HPA
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
        app.kubernetes.io/part-of: maple-stack
        maple-image: managed
    spec:
      serviceAccountName: gateway-api-sa
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: single-request-reopen
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gateway-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: maple-local:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/backend/backendB-core-services/gateway-api/service
          command: ["node", "/app/backend/backendB-core-services/gateway-api/service/src/main.js"]
          ports:
            - name: https
              containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_OPTIONS
              value: "--max-semi-space-size=128 --max-old-space-size=1536"
            - name: GATEWAY_PORT
              value: "3000"
            - name: MAPLE_STATE_DIR
              value: /app/backend/backendB-core-services/gateway-api/service/.mcp-use
            - name: MAPLE_GATEWAY_TLS_CERT
              value: /etc/maple/tls/tls.crt
            - name: MAPLE_GATEWAY_TLS_KEY
              value: /etc/maple/tls/tls.key
            - name: MAPLE_GATEWAY_TLS_CA
              value: /etc/maple/tls/ca.crt
            - name: MAPLE_GRPC_TLS_CERT
              value: /etc/maple/tls/tls.crt
            - name: MAPLE_GRPC_TLS_KEY
              value: /etc/maple/tls/tls.key
            - name: MAPLE_GRPC_TLS_CA
              value: /etc/maple/tls/ca.crt
            - name: CONTEXT_WALL_ADDRESS
              value: dns:///context-wall.maple.svc.cluster.local:9000
            - name: AUDIT_WRITER_ADDRESS
              value: dns:///audit-writer.maple.svc.cluster.local:9400
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: maple-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.maple.svc.cluster.local:5432/$(POSTGRES_DB)
            - name: OPENCLAW_BRIDGE_URL
              value: http://127.0.0.1:8787
            - name: OPENCLAW_GATEWAY_WS_URL
              value: ws://openclaw-gateway.maple.svc.cluster.local:19001
            - name: OPENCLAW_BRIDGE_MODE
              value: local
          envFrom:
            - configMapRef:
                name: maple-config
            - secretRef:
                name: maple-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: maple-tls
              mountPath: /etc/maple/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: gateway-resources
              mountPath: /app/backend/backendB-core-services/gateway-api/service/resources
        - name: openclaw-bridge
          image: maple-local:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/backendA-platform-infra/scripts/openclaw-bridge-hardcoded.mjs"]
          env:
            - name: OPENCLAW_BRIDGE_PORT
              value: "8787"
            - name: OPENCLAW_BRIDGE_MODE
              value: local
            - name: OPENCLAW_GATEWAY_WS_URL
              value: ws://openclaw-gateway.maple.svc.cluster.local:19001
            - name: OPENCLAW_GATEWAY_SESSION_KEY
              value: agent-dev-main
          envFrom:
            - secretRef:
                name: maple-secrets
          ports:
            - name: openclaw-bridge
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /health
              port: openclaw-bridge
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: maple-tls
          secret:
            secretName: maple-tls
        - name: tmp
          emptyDir: {}
        - name: gateway-resources
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-gateway
  namespace: maple
  labels:
    app: openclaw-gateway
    app.kubernetes.io/part-of: maple-stack
    maple-image: managed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-gateway
  template:
    metadata:
      labels:
        app: openclaw-gateway
        app.kubernetes.io/part-of: maple-stack
        maple-image: managed
    spec:
      containers:
        - name: app
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
            - |
              set -e
              openclaw config set gateway.mode local >/tmp/openclaw-gateway-mode.log 2>&1 || true
              openclaw config set gateway.controlUi.allowedOrigins '["http://localhost","http://127.0.0.1","https://localhost","https://127.0.0.1"]' >/tmp/openclaw-control-ui-origins.log 2>&1 || true
              exec openclaw gateway run --dev --port 19001 --bind lan --verbose
          ports:
            - name: ws
              containerPort: 19001
          envFrom:
            - configMapRef:
                name: maple-config
            - secretRef:
                name: maple-secrets
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
---
