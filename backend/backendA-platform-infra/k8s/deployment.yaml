apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: maple
  labels:
    app: gateway-api
    app.kubernetes.io/part-of: maple-stack
    maple-image: managed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
        app.kubernetes.io/part-of: maple-stack
        maple-image: managed
    spec:
      containers:
        - name: app
          image: maple-local:dev
          imagePullPolicy: IfNotPresent
          command: ["bash", "backend/backendA-platform-infra/scripts/hackathon-start.sh"]
          ports:
            - name: http
              containerPort: 3000
            - name: toolhub
              containerPort: 8788
          env:
            - name: MAPLE_PROJECT_PATH
              value: /app/backend/backendB-core-services/maple-monolith
            - name: MAPLE_STATE_DIR
              value: /app/backend/backendB-core-services/maple-monolith/.mcp-use
            - name: OPENCLAW_BRIDGE_URL
              value: http://127.0.0.1:8787
            - name: OPENCLAW_GATEWAY_WS_URL
              value: ws://openclaw-gateway.maple.svc.cluster.local:19001
            - name: OPENCLAW_BRIDGE_MODE
              value: local
          envFrom:
            - configMapRef:
                name: maple-config
            - secretRef:
                name: maple-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: maple-data
              mountPath: /app/backend/backendB-core-services/maple-monolith/data
        - name: openclaw-bridge
          image: maple-local:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/backendA-platform-infra/scripts/openclaw-bridge-hardcoded.mjs"]
          env:
            - name: OPENCLAW_BRIDGE_PORT
              value: "8787"
            - name: OPENCLAW_BRIDGE_MODE
              value: local
            - name: OPENCLAW_GATEWAY_WS_URL
              value: ws://openclaw-gateway.maple.svc.cluster.local:19001
            - name: OPENCLAW_GATEWAY_SESSION_KEY
              value: agent:dev:main
          envFrom:
            - secretRef:
                name: maple-secrets
          ports:
            - name: openclaw-bridge
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /health
              port: openclaw-bridge
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: maple-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-gateway
  namespace: maple
  labels:
    app: openclaw-gateway
    app.kubernetes.io/part-of: maple-stack
    maple-image: managed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-gateway
  template:
    metadata:
      labels:
        app: openclaw-gateway
        app.kubernetes.io/part-of: maple-stack
        maple-image: managed
    spec:
      containers:
        - name: app
          image: maple-local:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/backendA-platform-infra/scripts/service-shell.mjs"]
          ports:
            - name: ws
              containerPort: 19001
          env:
            - name: PORT
              value: "19001"
            - name: SERVICE_NAME
              value: openclaw-gateway
            - name: SERVICE_DESCRIPTION
              value: OpenClaw gateway simulation shell service
          readinessProbe:
            httpGet:
              path: /health
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
